<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Polyra Forge — Furniture AR Demo</title>

<script type="module"
src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
</script>

<style>

body {
margin: 0;
background: #eee6dc;
font-family: Arial, sans-serif;
text-align: center;
color: #2b2520;
}

h1 {
margin-top: 40px;
font-size: 32px;
}

p {
font-size: 16px;
}

model-viewer {
width: 100%;
height: 70vh;
background: #eee6dc;
}

</style>

</head>

<body>

<h1>POLYRA FORGE</h1>

<p>3D Furniture Preview & AR Demo</p>

<model-viewer
src="lounge-sofa.glb"
camera-controls
auto-rotate
ar
ar-modes="webxr scene-viewer quick-look"
shadow-intensity="1">

<button slot="ar-button">
View in Your Space
</button>

</model-viewer>

</body>

</html>
